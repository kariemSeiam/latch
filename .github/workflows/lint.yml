name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck all scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: latch CLI dispatches without error
        run: |
          chmod +x ./latch bin/*.sh test/*.sh
          ./latch help
          ./latch --help
          # unknown command must exit non-zero
          if ./latch bogus 2>/dev/null; then
            echo "expected failure on unknown command"; exit 1
          fi
          echo "dispatcher smoke test OK"

      - name: run test suite
        run: ./test/test_cli.sh
